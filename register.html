<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل الآن – أتعب هتلاقي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@600;700&display=swap">
<link rel="stylesheet" href="css/brand.css"><link rel="stylesheet" href="css/app.css">
<style>.fld{margin-top:12px}.fld label{font-weight:700;display:block;margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}.fld textarea{min-height:90px}.err{color:var(--bad);font-weight:700;font-size:14.5px;margin-top:4px}</style>
</head><body>
<script src="js/layout.js" data-root="" data-page="register.html"></script>
<div class="wrap"><main>
<div><h1>سجّل الآن</h1><p class="lead">سجّل بياناتك لينضم لك أستاذ كيرلس ويتواصل معك بخصوص المجموعات والمتابعة.</p></div>
<section class="card" id="formBox">
<div class="fld"><label for="nm">الاسم (ثلاثي)</label><input id="nm" type="text" maxlength="60" autocomplete="off" placeholder="اكتب اسمك"><div class="err" id="eNm" hidden></div></div>
<div class="fld"><label for="gr">الصف الدراسي</label><select id="gr"></select></div>
<div class="fld"><label for="ph">رقم واتساب للتواصل (اختياري)</label><input id="ph" type="tel" inputmode="numeric" maxlength="14" placeholder="01XXXXXXXXX" style="direction:ltr;text-align:right"><div class="err" id="ePh" hidden></div></div>
<div class="fld"><label for="nt">رسالتك لأستاذك (اختياري)</label><textarea id="nt" maxlength="300" placeholder="اكتب أي سؤال أو ملاحظة"></textarea></div>
<label class="chk" style="align-items:flex-start;margin-top:14px"><input type="checkbox" id="cs" style="margin-top:6px"><span id="csT">أوافق (أنا أو ولي أمري) على إرسال اسمي وصفي ورقمي لأستاذ كيرلس للتواصل معي فقط.</span></label><div class="err" id="eCs" hidden>لازم توافق أولًا علشان نرسل بياناتك.</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="go" type="button">إرسال طلب التسجيل</button><a class="btn alt" id="wa" style="text-decoration:none" target="_blank" rel="noopener" href="#">أو راسل أستاذك على واتساب</a></div>
<div class="fb info" id="st" hidden aria-live="polite" style="margin-top:12px"></div>
<p class="lead" style="font-size:14px;margin-top:12px" id="note"></p></section>
</main></div>
<script src="js/config.js"></script><script src="js/grades.js"></script><script src="js/register.js"></script>
<script src="js/helper.js" data-page="register" data-logo="assets/logo.png"></script>
</body></html>
