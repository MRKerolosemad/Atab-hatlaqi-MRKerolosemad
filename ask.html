<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسألني سؤال – أتعب هتلاقي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@600;700&display=swap">
<link rel="stylesheet" href="css/brand.css"><link rel="stylesheet" href="css/app.css">
<style>.ans h3{margin-top:14px}.ans ol,.ans ul{margin:6px 0 0;padding-inline-start:22px}.ans li{margin-bottom:6px}.src{display:inline-block;background:var(--surface2);border-inline-start:5px solid var(--c-i);border-radius:8px;padding:6px 12px;font-weight:700;margin-top:6px}.chip{font:inherit;font-weight:600;font-size:14.5px;padding:8px 12px;margin:4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}.idea{background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:700}</style>
</head><body>
<script src="js/layout.js" data-root="" data-page="ask.html"></script>
<div class="wrap"><main>
<div><h1>اسألني سؤال</h1><p class="lead">اكتب سؤالك في درس «توصيل المقاومات»، وهتلاقي الإجابة منظمة ومعاها مكانها في الكتاب.</p></div>
<section class="card"><label class="lbl" for="q" style="margin-top:0">اكتب سؤالك</label>
<div class="qin"><input class="field ar" id="q" type="text" autocomplete="off" placeholder="مثال: ليه الأجهزة المنزلية على التوازي؟"><button class="btn" id="go" type="button">اسأل</button></div>
<div style="margin-top:10px" id="ex"></div>
<p class="lead" style="margin-top:8px;font-size:14px">كل إجابة معاها اسم الجزء اللي ترجعله في الكتاب. لو السؤال مش موجود في المنهج بنقولك بدل ما نخمّن.</p></section>
<section id="out" aria-live="polite"></section>
</main></div>
<script src="js/config.js"></script><script src="js/qa-data.js"></script><script src="js/qa.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i);},D=QAEngine.prep(window.QA),C=window.PLATFORM;
function L(t){return String(t).replace(/\{\{(.*?)\}\}/g,'<span class="ltr">$1</span>');}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var EXQ=['يعني ايه المقاومة المكافئة؟','ايه الفرق بين التوالي والتوازي؟','ليه الأجهزة المنزلية على التوازي؟','لو لمبة اتلفت في التوالي ايه اللي بيحصل؟','اشرح جهاز منظم ضربات القلب'];
$('ex').innerHTML=EXQ.map(function(q){return '<button type="button" class="chip">'+esc(q)+'</button>';}).join('');
function chips(list){return list.map(function(e){return '<button type="button" class="chip" data-id="'+e.id+'">'+L(e.t)+'</button>';}).join('');}
function card(e){return '<article class="card ans"><h2>'+L(e.t)+'</h2><h3>💡 الفكرة</h3><p class="idea">'+L(e.idea)+'</p><h3>📖 الشرح المبسط</h3><ol>'+e.ex.map(function(x){return '<li>'+L(x)+'</li>';}).join('')+'</ol>'+(e.eg?'<h3>✏️ مثال</h3><p>'+L(e.eg)+'</p>':'')+(e.note?'<h3>⚠️ ملاحظة</h3><p>'+L(e.note)+'</p>':'')+'<h3>📍 راجع جزء</h3><span class="src">'+esc(e.src)+'</span></article>';}
function ask(q){
  q=q.trim();if(!q){$('q').focus();return;}
  var r=QAEngine.search(q,D),h='';
  if(r.top){h=card(r.top);if(r.related.length)h+='<div class="card"><b>أسئلة قريبة:</b><div>'+chips(r.related)+'</div></div>';}
  else{var wa='https://wa.me/'+C.waNumber+'?text='+encodeURIComponent('سؤال من منصة أتعب هتلاقي: '+q);
    h='<div class="card"><div class="fb info"><b>السؤال ده مش موجود في صفحات المنهج اللي عندي.</b><br>اختار من الموضوعات الموجودة، أو اسأل أستاذك مباشرة.</div><div style="margin-top:8px">'+chips(D)+'</div><a class="btn alt" style="display:inline-block;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="'+wa+'">اسأل أستاذ كيرلس على واتساب</a></div>';}
  $('out').innerHTML=h;$('out').scrollIntoView({behavior:'smooth',block:'start'});
}
$('go').addEventListener('click',function(){ask($('q').value);});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')ask($('q').value);});
document.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;if(b.dataset.id){var x=D.filter(function(d){return d.id===b.dataset.id;})[0];$('out').innerHTML=card(x);$('out').scrollIntoView({behavior:'smooth',block:'start'});}else{$('q').value=b.textContent;ask(b.textContent);}});
})();
</script><script src="js/helper.js" data-page="ask" data-logo="assets/logo.png"></script>
</body></html>
